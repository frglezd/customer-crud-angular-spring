<p>Create customer</p>

<div class="container">
<form>
  <div class="mb-3">
    <label for="firstname" class="form-label">Name</label>
    <input [(ngModel)]="firstName" type="text" class="form-control" id="firstName" name="firstName">
  </div>
  <div class="mb-3">
    <label for="lastname" class="form-label">Last name</label>
    <input [(ngModel)]="lastName" type="text" class="form-control" id="lastName" name="lastName">
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input [(ngModel)]="email" type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="email">
  </div>


  <button type="submit" class="btn btn-primary" (click)="addCustomer()">Submit</button>
</form>
</div>
