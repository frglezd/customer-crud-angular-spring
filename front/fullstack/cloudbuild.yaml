# Builds the Angular SSR frontend and deploys it to Cloud Run.
# Paths are relative to the repository root, where Cloud Build runs.
substitutions:
  _SERVICE_NAME: customer-crud-angular-spring-frontend
  _DEPLOY_REGION: europe-west1
  _IMAGE: ${_DEPLOY_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/customer-crud-angular-spring/${_SERVICE_NAME}:${COMMIT_SHA}

steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args: ["build", "--no-cache", "-t", "${_IMAGE}", "-f", "front/fullstack/Dockerfile", "front/fullstack"]

  - id: Push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE_NAME}
      - --platform=managed
      - --image=${_IMAGE}
      - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=${COMMIT_SHA},gcb-build-id=${BUILD_ID}
      - --region=${_DEPLOY_REGION}
      - --quiet

images:
  - ${_IMAGE}

options:
  substitutionOption: ALLOW_LOOSE
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
